name: CI

on:
  pull_request:
    branches:
      - master

jobs:
  php-syntax:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Dockerfile's base image is the source of truth for the PHP version.
      # composer.json must pin the same version, as Dependabot resolves
      # Composer updates against it.
      - name: Get PHP version
        id: php-version
        run: |
          version=$(sed -n 's/^FROM php:\([0-9]*\.[0-9]*\).*/\1/p' Dockerfile)
          test -n "$version"
          composer_version=$(jq -r '.config.platform.php' composer.json)
          if [ "$version" != "$composer_version" ]; then
            echo "::error file=composer.json::config.platform.php is $composer_version but the Dockerfile uses PHP $version. Update composer.json and run 'composer update --lock'."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.php-version.outputs.version }}

      - name: Check PHP syntax
        run: |
          find . \
            -name "*.php" \
            -not -path "./.git/*" \
            -not -path "./externals/*" \
            -print0 \
            | xargs -0 -n1 php -l

  json-lint:
    name: JSON Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate JSON files
        run: |
          find . \
            \( -path "./.git" -o -path "./externals" \) -prune -o \
            -name "*.json" \
            -print0 \
            | xargs -0 -I{} jq empty {}

  phab-tests:
    name: Phabricator Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        run: sudo apt-get update && sudo apt-get install --yes just

      - name: Build production image
        run: just build-production
      - name: Build tools image
        run: just build
      - name: Run tests
        run: just test

  phab-lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # `just lint` lints the changes since `origin/master`.
          fetch-depth: 0

      - name: Install just
        run: sudo apt-get update && sudo apt-get install --yes just

      - name: Build tools image
        run: just build
      - name: Lint changes
        run: just lint
      - name: Run PHPStan
        run: just phpstan

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
    defaults:
      run:
        working-directory: rust
    env:
      PHAB_TEST_MYSQL_URL: mysql://root:password@127.0.0.1:3306
      PHAB_TEST_REQUIRE_MYSQL: 1
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup toolchain install nightly --profile minimal --component rustfmt
          rustup default stable

      # rustfmt.toml uses options of the Google Rust style guide which only
      # nightly rustfmt applies.
      - name: Check formatting
        run: cargo +nightly fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: nginx routing
        run: scripts/test-nginx-routing.sh
