# Web pages of the Rust interface (RUST_PORT_PLAN.md §9). Users opt in with
# the phab_ui=rust cookie, set by /rust-ui/on and cleared by /rust-ui/off;
# everyone else keeps seeing PHP. Remove a page from the list and reload
# nginx to give it back to PHP.

# The interface switch and the static files of the Rust pages.
location ^~ /rust-ui/ {
  include /app/nginx/rust/proxy.inc;
}

location ^~ /rsrc-rust/ {
  include /app/nginx/rust/proxy.inc;
}

# The ported pages.
location = / {
  include /app/nginx/rust/page.inc;
}

location = /differential/ {
  include /app/nginx/rust/page.inc;
}

# A revision, one of its diffs (?id=) and its raw diff (?download=true,
# which stores the patch as a temporary file like PHP: a request replayed
# after a timeout stores a second one, which expires as well).
location ~ ^/D[0-9]+$ {
  include /app/nginx/rust/page.inc;
}

# The changes since the viewer's last action; when they are a comparison
# between two diffs, PHP shows them (421).
location ~ ^/D[0-9]+/new/$ {
  include /app/nginx/rust/page.inc;
}

# Diffs (those of revisions redirect to the revision) and their list of
# changesets; the "Attach To" form posts to PHP (421).
location ~ ^/differential/diff/[0-9]+/(changesets/(query/[^/]+/)?)?$ {
  include /app/nginx/rust/page.inc;
}

# A changeset alone, and the Ajax requests of PHP's revision and diff
# pages for each changeset and its "show more" context: the service
# answers them from PHP's parse cache with PHP's JSON, and 421 (read-only,
# replayed with their body) for anything else.
location = /differential/changeset/ {
  include /app/nginx/rust/page.inc;
}

# The inline comments and the affected path index of a revision, and why
# a commit closed it (PHP's pages open the latter as a dialog, which the
# service hands back to PHP).
location ~ ^/differential/revision/(inlines|paths)/[0-9]+/$ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/differential/revision/closedetails/PHID-XACT-DREV-[a-z0-9]+/$ {
  include /app/nginx/rust/page.inc;
}

# The Ajax operations of the inline comment editor of PHP's pages: the
# service writes hiding, "Done", deleting, restoring, cancelling and
# versioned drafts as PHP does, and answers 421 before writing the others
# (the operations which render the editor or the comment), which PHP
# replays with their body.
location ~ ^/differential/comment/inline/edit/[0-9]+/$ {
  include /app/nginx/rust/page.inc;
}

# Review actions of the Rust revision page: the service writes them as
# PHP's comment form would, or posts that form to PHP as the user (and
# inline comments to PHP's Conduit API). PHP has no such route, so a replay
# against it can't write twice. The service answers failed writes with
# 503, which is not replayed, so the user sees why.
location ~ ^/D[0-9]+/action$ {
  include /app/nginx/rust/page.inc;
}

# PHP's comment form of revisions, and the "Subscribe" and "Unsubscribe"
# actions of revisions: the service writes what PHP's editor would, and
# answers 421 before writing anything it doesn't port (workflow requests,
# drafts, inline comments to publish, actions not ported), so the replay
# against PHP writes once.
location ~ ^/differential/revision/edit/[0-9]+/comment/$ {
  include /app/nginx/rust/page.inc;
}

# PHP's edit form of revisions: the service shows it, and writes its posts
# as PHP's editor would (title, summary, test plan, reviewers, tags,
# subscribers, Bugzilla bug ID), answering 421 before writing anything
# else, so the replay against PHP writes once.
location ~ ^/differential/revision/edit/[0-9]+/$ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/subscriptions/(add|delete)/PHID-DREV-[a-z0-9]+/$ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/p/[^/]+/$ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/people/(revisions|manage)/[0-9]+/$ {
  include /app/nginx/rust/page.inc;
}

# The people list and its builtin queries; the approval queue, saved
# queries and search parameters fall back to PHP.
location = /people/ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/people/query/[^/]+/$ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/tag/[^/]+/$ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/project/(view|profile|members|subprojects|manage)/[0-9]+/$ {
  include /app/nginx/rust/page.inc;
}

# The project list and its builtin queries.
location = /project/ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/project/query/[^/]+/$ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/project/filter/[^/]+/$ {
  include /app/nginx/rust/page.inc;
}

# The edit form of projects, joining, leaving, watching and unwatching:
# the service shows the forms and writes the name, icon, color, hashtags,
# members and watchers as PHP's editor does, and answers 421 before
# writing anything it doesn't port (descriptions, policies, workflow
# requests, subprojects), so the replay against PHP writes once.
location ~ ^/project/(edit|watch|unwatch)/[0-9]+/$ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/project/update/[0-9]+/(join|leave)/$ {
  include /app/nginx/rust/page.inc;
}

# The feed, its builtin queries (saved ones fall back to PHP) and single
# stories (as text they fall back too).
location = /feed/ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/feed/(query/[^/]+|[0-9]+)/$ {
  include /app/nginx/rust/page.inc;
}

# Notifications and their builtin queries. Marking them read, the menu's
# panel and saved queries stay with PHP.
location = /notification/ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/notification/query/[^/]+/$ {
  include /app/nginx/rust/page.inc;
}

# Harbormaster: buildables, builds and their older runs, build plans, and
# the default lists of buildables and plans.
location ~ ^/B[1-9][0-9]*$ {
  include /app/nginx/rust/page.inc;
}

location = /harbormaster/ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/harbormaster/build/[0-9]+/([0-9]+/)?$ {
  include /app/nginx/rust/page.inc;
}

# The builtin queries of builds and plans (saved ones fall back to PHP),
# build logs and build steps.
location ~ ^/harbormaster/(build|plan)/(query/[^/]+/)?$ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/harbormaster/(log|step)/view/[0-9]+/$ {
  include /app/nginx/rust/page.inc;
}

# The lint messages and unit test results of a buildable, and one result.
location ~ ^/harbormaster/(lint|unit|unit/view)/[0-9]+/$ {
  include /app/nginx/rust/page.inc;
}

location = /harbormaster/plan/ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/harbormaster/plan/[0-9]+/$ {
  include /app/nginx/rust/page.inc;
}

# Herald: rules, the builtin rule queries, transcripts and the default
# list of transcripts. Saved queries, filters, adapters other than
# revisions and the transactions view of transcripts fall back to PHP.
location ~ ^/H[1-9][0-9]*$ {
  include /app/nginx/rust/page.inc;
}

location = /herald/ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/herald/query/[^/]+/$ {
  include /app/nginx/rust/page.inc;
}

location = /herald/transcript/ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/herald/transcript/query/[^/]+/$ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/herald/transcript/[1-9][0-9]*/([^/]+/)?$ {
  include /app/nginx/rust/page.inc;
}

# The confirmation of disabling or enabling a rule, the form of the test
# console and the builtin lists of webhooks. Their posts change the rule or
# run the rules, which PHP does (421, replayed with their body).
location ~ ^/herald/disable/[1-9][0-9]*/[A-Za-z0-9_]+/$ {
  include /app/nginx/rust/page.inc;
}

location = /herald/test/ {
  include /app/nginx/rust/page.inc;
}

location = /herald/webhook/ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/herald/webhook/query/[^/]+/$ {
  include /app/nginx/rust/page.inc;
}

# Dashboards and portals: a dashboard with its panels, and a portal with
# its menu and default dashboard.
location ~ ^/dashboard/view/[0-9]+/$ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/portal/view/[0-9]+/$ {
  include /app/nginx/rust/page.inc;
}

# A portal with the content of one of its items, the portal list and the
# dashboard console.
location ~ ^/portal/view/[0-9]+/view/[^/]+/$ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/portal/(query/[^/]+/)?$ {
  include /app/nginx/rust/page.inc;
}

location = /dashboard/console/ {
  include /app/nginx/rust/page.inc;
}

# The "configure" route of the portal, home and favorites menus, which
# redirects to an edit mode or lists them; the modes' pages stay with PHP.
location ~ ^/portal/view/[0-9]+/configure/$ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/(home|favorites)/menu/configure/$ {
  include /app/nginx/rust/page.inc;
}

# The home page's other address.
location = /home/ {
  include /app/nginx/rust/page.inc;
}

# Panels, and the builtin queries of the dashboard and panel lists.
location ~ ^/W[0-9]+$ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/dashboard/(panel/)?$ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/dashboard/(panel/)?query/[^/]+/$ {
  include /app/nginx/rust/page.inc;
}

# The favorites menu, read-only; configuring it stays with PHP.
location = /favorites/ {
  include /app/nginx/rust/page.inc;
}

# Diffusion, Git repositories: the repository list and its builtin
# queries, the repository home, browse (with blame), history, branches,
# tags, the change of a path, comparisons, the management panels
# (read-only) and commits, and what the pages' scripts load (lastmodified,
# blame, the path tree of "Locate File", the branches and tags of a
# commit). Mercurial and Subversion repositories, searches, form posts
# (the compare dialog, lastmodified without a valid CSRF token) and the
# other views fall back to PHP (421), which replays posts with their body.
# Version control clients send no phab_ui cookie, so they always reach
# PHP.
location = /diffusion/ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/diffusion/query/[^/]+/$ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/(source/[^/]+|diffusion/([A-Z]+|[1-9][0-9]*))/((repository|browse|history|branches|tags|blame|change|compare|lastmodified|pathtree)/.*)?$ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/(source/[^/]+|diffusion/([A-Z]+|[1-9][0-9]*))/manage/([^/]+/)?$ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/(source/[^/]+|diffusion/([A-Z]+|[1-9][0-9]*))/commit/[a-z0-9]+(/|/(branches|tags)/)?$ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/(r[A-Z]+[a-f0-9]+|R[1-9][0-9]*:[a-f0-9]+)$ {
  include /app/nginx/rust/page.inc;
}

# Settings: a user's own settings and the panels Rust shows. The service
# writes preference saves as PHP's editor does, and answers 421 before
# writing anything it doesn't port (a value PHP refuses, the translations
# of developer mode), so a replay against PHP writes once. The actions of
# the address list (their query strings), of Conduit API tokens and of
# sessions write PHP's rows too, through the TOTP high security prompt
# where PHP requires one; other factors, workflow dialogs, the other
# panels and administrators editing bots' settings fall back to PHP.
location = /settings/ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/settings/panel/[^/]+/$ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/settings/user/[^/]+/(page/(datetime|language|diff|display|editor|email|emaildelivery|emailformat|emailpreferences|multifactor|apitokens|sessions)/)?$ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/conduit/token/(edit|terminate)/([0-9]+/)?$ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/auth/session/(terminate/[^/]+|downgrade)/$ {
  include /app/nginx/rust/page.inc;
}

# Files: file pages, the builtin queries of the list, and file data with
# PHP's headers. Data requests without the phab_ui cookie, which is
# always the case on an alternate file domain, stay with PHP; the
# download dialog, wrong keys and partial uploads fall back to PHP.
location ~ ^/F[1-9][0-9]*$ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/file/((query/[^/]+/)?|info/PHID-FILE-[a-z0-9]+/|view/[0-9]+/)$ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/file/(data|download)/ {
  include /app/nginx/rust/page.inc;
}

# Typeahead results of users, projects and reviewers, which PHP's pages
# post to as their tokenizers are typed in. Read-only: the 421 of what
# isn't ported is replayed with its body.
location ~ ^/typeahead/class/(PhabricatorPeopleDatasource|PhabricatorProjectDatasource|DifferentialReviewerDatasource|DifferentialBlockingReviewerDatasource)/$ {
  include /app/nginx/rust/page.inc;
}

# The pages mail links to: change details, comment histories and raw
# comments of revision transactions, the forms editing and removing their
# comments, and subscribers of revisions. PHP's pages open them as
# dialogs, which the service hands back to PHP. The service saves the
# forms' posts as PHP's comment editor does, and answers 421 before
# writing what it doesn't port (MFA prompts, remarkup effects, implicit
# subscriptions), so the replay against PHP writes once. Quotes of
# comments for PHP's comment forms are read-only.
location ~ ^/transactions/(detail|history|raw|edit|remove|quote)/PHID-XACT-DREV-[a-z0-9]+/$ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/subscriptions/list/PHID-DREV-[a-z0-9]+/$ {
  include /app/nginx/rust/page.inc;
}

# The viewer's flags.
location ~ ^/flag/(query/[^/]+/)?$ {
  include /app/nginx/rust/page.inc;
}

# The read-only pages of the administration and infrastructure
# applications (W14); the home page is the first location above. Forms
# posted to them, saved queries and what Rust doesn't port (setup issues,
# daemon logs, the Conduit console's form, methods with documentation
# pages, customized home menus, fulltext searches) fall back to PHP.
location = /applications/ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/applications/(query/[^/]+|view/[A-Za-z0-9_]+)/$ {
  include /app/nginx/rust/page.inc;
}

location = /config/ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/config/(settings/((advanced|all)/)?|edit/[A-Za-z0-9_.-]+/)$ {
  include /app/nginx/rust/page.inc;
}

location = /daemon/ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/daemon/(task/[0-9]+/|bulk/(query/[^/]+/)?)$ {
  include /app/nginx/rust/page.inc;
}

location = /conduit/ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/conduit/(query/[^/]+|method/[^/]+)/$ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/policy/explain/PHID-APPS-[A-Za-z0-9_]+/[^/]+/$ {
  include /app/nginx/rust/page.inc;
}

location = /spaces/ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/spaces/query/[^/]+/$ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/S[1-9][0-9]*$ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/mail/detail/[0-9]+/$ {
  include /app/nginx/rust/page.inc;
}

location ~ ^/help/(documentation/[A-Za-z0-9_]+|keyboardshortcut)/$ {
  include /app/nginx/rust/page.inc;
}

# The header's search box: jumps to applications and revisions; searches
# go to PHP.
location = /search/ {
  include /app/nginx/rust/page.inc;
}
