# Web pages of the Rust interface (RUST_PORT_PLAN.md §9). Users opt in with
# the phab_ui=rust cookie, set by /rust-ui/on and cleared by /rust-ui/off;
# everyone else keeps seeing PHP. Remove a page from the list and reload
# nginx to give it back to PHP.

# The interface switch and the static files of the Rust pages.
location ^~ /rust-ui/ {
  include /app/nginx/rust/proxy.inc;
}

location ^~ /rsrc-rust/ {
  include /app/nginx/rust/proxy.inc;
}

# The ported pages. 418: the user didn't opt in or asked for PHP. 421: the
# page needs something Rust doesn't do yet (a logged-out user, a pending MFA
# prompt). 502/504: the Rust service is down. Pages are read-only, so
# replaying them against PHP is safe.
location = / {
  if ($cookie_phab_ui != "rust") {
    return 418;
  }
  if ($http_x_phab_skip_rust) {
    return 418;
  }
  include /app/nginx/rust/proxy.inc;
  proxy_intercept_errors on;
  error_page 418 421 502 504 = @php;
}
