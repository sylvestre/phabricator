# Conduit methods answered by the Rust service. Remove a method from the list
# and reload nginx to send it back to PHP.
#
# Methods in the service's PHAB_SHADOW_METHODS are listed here too: for them
# the service forwards the request to PHP, returns PHP's answer and only
# compares its own.
location ~ ^/api/(conduit\.ping)$ {
  # Resolve the service per request: with a literal host name, nginx refuses
  # to start (taking PHP down with it) whenever the name doesn't resolve.
  # 127.0.0.11 is Docker's resolver; use the platform's one elsewhere.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $phab_rust http://phab-rust:8080;
  proxy_pass $phab_rust;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # 421: the request needs something the Rust code doesn't implement.
  # 502/504: the Rust service is down or unreachable. Only read-only methods
  # are routed here, so replaying a timed-out call is safe.
  # 418: the caller (the shadow mode or phab-replay) asked for PHP.
  if ($http_x_phab_skip_rust) {
    return 418;
  }
  proxy_intercept_errors on;
  proxy_connect_timeout 2s;
  error_page 418 421 502 504 = @php;
}
