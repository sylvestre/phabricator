# Conduit methods answered by the Rust service. Remove a method from the list
# and reload nginx to send it back to PHP.
location ~ ^/api/(conduit\.ping)$ {
  proxy_pass http://phab-rust:8080;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # 421: the request needs something the Rust code doesn't implement.
  # 502: the Rust service is down.
  proxy_intercept_errors on;
  error_page 421 502 = @php;
}
