# Conduit methods answered by the Rust service. Remove a method from the list
# and reload nginx to send it back to PHP.
#
# Methods in the service's PHAB_SHADOW_METHODS are listed here too: for them
# the service forwards the request to PHP, returns PHP's answer and only
# compares its own.
location ~ ^/api/(conduit\.ping|conduit\.query|auth\.querypublickeys|diffusion\.diffquery|feed\.query|diffusion\.internal\.ancestors|diffusion\.branchquery|diffusion\.tagsquery|diffusion\.refsquery|diffusion\.resolverefs|diffusion\.existsquery|diffusion\.commitparentsquery|diffusion\.mergedcommitsquery|diffusion\.historyquery|diffusion\.lastmodifiedquery|diffusion\.blame|diffusion\.browsequery|diffusion\.searchquery|diffusion\.querypaths|diffusion\.internal\.gitrawdiffquery|diffusion\.findsymbols|diffusion\.getrecentcommitsbypath|diffusion\.getlintmessages|portal\.search|differential\.getcommitmessage|differential\.parsecommitmessage|user\.whoami|feed\.query_id|bugzilla\.account\.search|bmoexternalaccount\.search|differential\.revision\.search|user\.search|project\.search|diffusion\.repository\.search|differential\.diff\.search|edge\.search|transaction\.search|phid\.query|phid\.info|phid\.lookup|diffusion\.commit\.search|differential\.changeset\.search|differential\.querydiffs|differential\.getrawdiff|differential\.query|user\.query|project\.query|file\.search|file\.info|user\.find|differential\.getcommitpaths|repository\.query|conduit\.getcapabilities|differential\.getalldiffs|differential\.getdiff|differential\.getrevisioncomments|differential\.getrevision|diffusion\.querycommits|differential\.custom\.revision\.visibility|policy\.query|audit\.query|internal\.commit\.search|flag\.query|remarkup\.process|harbormaster\.buildable\.search|harbormaster\.build\.search|harbormaster\.buildplan\.search|harbormaster\.step\.search|harbormaster\.target\.search|harbormaster\.artifact\.search|harbormaster\.log\.search|harbormaster\.querybuildables|harbormaster\.querybuilds|feed\.for_email\.query|feed\.for_email\.query_id|feed\.for_email\.status|feed\.for_email\.status_id)$ {
  # 421: the request needs something the Rust code doesn't implement.
  # 502/504: the Rust service is down or unreachable. Only read-only methods
  # are routed here, so replaying a timed-out call is safe.
  # 418: the caller (the shadow mode or phab-replay) asked for PHP.
  if ($http_x_phab_skip_rust) {
    return 418;
  }
  include /app/nginx/rust/proxy.inc;
  proxy_intercept_errors on;
  error_page 418 421 502 504 = @php;
}

# Write methods answered by the Rust service, each verified with
# scripts/write-parity.py. Unlike the block above, a 502/504 is not replayed
# to PHP: the Rust service may have committed before failing, and replaying
# would write twice. Only 421 (not ported) and 418 (PHP asked for) go to PHP,
# both answered before Rust writes anything. differential.creatediff matched
# PHP on a real moz-phab submit; harbormaster.sendmessage waits for a Lando
# or CI contract run, differential.revision.edit for moz-phab and Lando ones.
location ~ ^/api/(differential\.creatediff|differential\.setdiffproperty|flag\.edit|flag\.delete|project\.create|project\.edit|policy\.create|user\.edit|user\.enable|user\.disable|file\.upload|file\.allocate|file\.uploadchunk|file\.uploadhash|file\.querychunks|file\.download|differential\.createrawdiff|diffusion\.filecontentquery|diffusion\.rawdiffquery|diffusion\.looksoon|diffusion\.repository\.edit|harbormaster\.buildplan\.edit|dashboard\.panel\.edit|portal\.edit)$ {
  if ($http_x_phab_skip_rust) {
    return 418;
  }
  include /app/nginx/rust/proxy.inc;
  proxy_intercept_errors on;
  error_page 418 421 = @php;
}
