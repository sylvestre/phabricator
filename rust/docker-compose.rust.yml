# Runs the Rust service next to the PHP stack of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f rust/docker-compose.rust.yml up
#
# nginx then sends the routes of rust/nginx/*.conf to `phab-rust`.
services:
  phab-rust:
    build:
      context: ./rust
    environment:
      - PHAB_CONFIG_DIR=/app/phabricator/conf/local
      - RUST_LOG=info
      # Methods answered by PHP and only compared by Rust (comma separated).
      - PHAB_SHADOW_METHODS=${PHAB_SHADOW_METHODS:-user.whoami,feed.query_id,bugzilla.account.search,bmoexternalaccount.search,differential.revision.search,user.search,project.search,diffusion.repository.search,differential.diff.search,edge.search,transaction.search,phid.query,phid.info,phid.lookup,diffusion.commit.search,differential.changeset.search,differential.querydiffs,differential.getrawdiff}
      - PHAB_PHP_URL=http://phabricator.test
      # Repositories (short name or callsign) whose files link to Searchfox.
      - PHAB_SEARCHFOX_TREES=${PHAB_SEARCHFOX_TREES:-mozilla-central=mozilla-central}
    volumes:
      # Shares conf/local/local.json, written by the PHP container's
      # entrypoint, so both stacks read the same configuration.
      - phabricator-app:/app:ro
    depends_on:
      - phabricator
    restart: on-failure

  phabricator.test:
    volumes:
      - ./rust/nginx:/app/nginx/rust:ro
    depends_on:
      - phab-rust
