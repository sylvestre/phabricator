# Runs the Rust service next to the PHP stack of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f rust/docker-compose.rust.yml up
#
# nginx then sends the routes of rust/nginx/*.conf to `phab-rust`.
services:
  phab-rust:
    build:
      context: ./rust
    environment:
      - PHAB_CONFIG_DIR=/app/phabricator/conf/local
      - RUST_LOG=info
      # Methods answered by PHP and only compared by Rust (comma separated).
      - PHAB_SHADOW_METHODS=${PHAB_SHADOW_METHODS:-user.whoami,feed.query,diffusion.internal.ancestors,diffusion.branchquery,diffusion.tagsquery,diffusion.refsquery,diffusion.resolverefs,diffusion.existsquery,diffusion.commitparentsquery,diffusion.mergedcommitsquery,diffusion.historyquery,diffusion.lastmodifiedquery,diffusion.blame,diffusion.browsequery,diffusion.searchquery,diffusion.querypaths,diffusion.internal.gitrawdiffquery,diffusion.getrecentcommitsbypath,diffusion.getlintmessages,portal.search,differential.getcommitmessage,differential.parsecommitmessage,feed.query_id,bugzilla.account.search,bmoexternalaccount.search,differential.revision.search,user.search,project.search,diffusion.repository.search,differential.diff.search,edge.search,transaction.search,phid.query,phid.info,phid.lookup,diffusion.commit.search,differential.changeset.search,differential.querydiffs,differential.getrawdiff,differential.query,user.query,project.query,file.search,file.info,user.find,differential.getcommitpaths,repository.query,conduit.getcapabilities,differential.getalldiffs,differential.getdiff,differential.getrevisioncomments,differential.getrevision,diffusion.querycommits,differential.custom.revision.visibility,policy.query,audit.query,internal.commit.search,flag.query,remarkup.process,harbormaster.buildable.search,harbormaster.build.search,harbormaster.buildplan.search,harbormaster.step.search,harbormaster.target.search,harbormaster.artifact.search,harbormaster.log.search,harbormaster.querybuildables,harbormaster.querybuilds,feed.for_email.query,feed.for_email.query_id,feed.for_email.status,feed.for_email.status_id}
      - PHAB_PHP_URL=http://phabricator.test
      - PHAB_MIME_COMMAND=file --brief --mime
      # The repositories' working copies belong to the PHP container's user.
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=*
      # Repositories (short name or callsign) whose files link to Searchfox.
      - PHAB_SEARCHFOX_TREES=${PHAB_SEARCHFOX_TREES:-mozilla-central=mozilla-central}
    volumes:
      # Shares conf/local/local.json, written by the PHP container's
      # entrypoint, so both stacks read the same configuration.
      - phabricator-app:/app:ro
      # The repositories' working copies, at the path PHP uses.
      - phabricator-repo:/var/repo:ro
    depends_on:
      - phabricator
    restart: on-failure

  phabricator:
    volumes:
      - phabricator-repo:/var/repo

  phabricator.test:
    volumes:
      - ./rust/nginx:/app/nginx/rust:ro
    depends_on:
      - phab-rust

volumes:
  phabricator-repo:
