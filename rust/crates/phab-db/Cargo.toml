[package]
name = "phab-db"
description = "MySQL access to the phabricator_* databases shared with the PHP application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Helpers to build throwaway databases from resources/sql/quickstart.sql.
test-support = ["dep:rand"]

[dependencies]
phab-core.workspace = true
rand = { workspace = true, optional = true }
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
phab-db = { path = ".", features = ["test-support"] }
proptest.workspace = true
rstest.workspace = true
tokio.workspace = true

[lints]
workspace = true
