{%- if !buttons.is_empty() %}
<nav class="hm-actions diffusion-buttons" aria-label="Actions">
  <ul>
    {%- for button in buttons %}
    <li><a href="{{ button.href }}"><span class="fa {{ button.icon }}" aria-hidden="true"></span> {{ button.text }}</a></li>
    {%- endfor %}
  </ul>
</nav>
{%- endif %}
