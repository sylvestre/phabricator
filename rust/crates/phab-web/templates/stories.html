<ul class="feed">
  {%- for story in stories %}
  <li class="feed-story"><span class="feed-title">{{ story.title_html|safe }}</span> <time class="muted">{{ story.date }}</time>{% if let Some(body) = story.body_html %}<div class="feed-body">{{ body|safe }}</div>{% endif %}</li>
  {%- endfor %}
</ul>
