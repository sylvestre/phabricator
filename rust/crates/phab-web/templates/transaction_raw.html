{% extends "layout.html" %}
{% block content %}
<header class="profile-header">
  <h1>Raw Comment</h1>
  <p class="muted"><a href="{{ revision_uri }}">{{ revision_name }}</a></p>
</header>
<form class="settings-form">
  <div class="settings-field">
    <textarea readonly rows="12" aria-label="Raw Comment">{{ content }}</textarea>
  </div>
</form>
<p><a class="hm-button" href="{{ revision_uri }}">Cancel</a></p>
{% endblock %}
