[workspace]
resolver = "3"
members = ["crates/phab-core", "crates/phab-db", "crates/phab-policy", "crates/phab-auth", "crates/phab-conduit", "crates/phab-parity", "crates/phab-web", "crates/phab-remarkup", "crates/phab-diff", "crates/apps/conduit", "crates/apps/people", "crates/apps/differential", "crates/apps/project", "crates/apps/feed", "bins/phab-server", "bins/phab-replay"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
phab-core = { path = "crates/phab-core" }
phab-db = { path = "crates/phab-db" }
phab-policy = { path = "crates/phab-policy" }
phab-auth = { path = "crates/phab-auth" }
phab-conduit = { path = "crates/phab-conduit" }
phab-app-conduit = { path = "crates/apps/conduit" }
phab-app-people = { path = "crates/apps/people" }
phab-app-differential = { path = "crates/apps/differential" }
phab-app-project = { path = "crates/apps/project" }
phab-app-feed = { path = "crates/apps/feed" }
phab-parity = { path = "crates/phab-parity" }
phab-web = { path = "crates/phab-web" }
phab-remarkup = { path = "crates/phab-remarkup" }
phab-diff = { path = "crates/phab-diff" }

askama = "0.14"
axum = "0.8"
flate2 = "1"
hex = "0.4"
form_urlencoded = "1"
hmac = "0.12"
indexmap = "2"
pcre2 = "0.2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustix = { version = "1", features = ["system"] }
sentry = { version = "0.42", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls", "tracing"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["decompression-gzip", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

proptest = "1"
rstest = "0.26"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
use_self = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Row structs mirror the boolean columns of the PHP schema.
struct_excessive_bools = "allow"
